<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="WEB-XR.studio">
  <!-- Composed WEB-XR.studio mark: bold "XR" with rotation arrows
       (top-right + bottom-left), assembled from the brand asset geometry. -->
  <!-- Top-right arrow -->
  <path fill="#111"
        d="M 93 18
           C 112 19 130 25 145 36
           C 165 50 178 72 182 96
           L 168 96
           C 163 72 149 53 129 43
           L 121 50
           Z"/>
  <!-- Bottom-left arrow (180° rotation of the top arrow) -->
  <path fill="#111" transform="rotate(180 100 100)"
        d="M 93 18
           C 112 19 130 25 145 36
           C 165 50 178 72 182 96
           L 168 96
           C 163 72 149 53 129 43
           L 121 50
           Z"/>
  <!-- XR wordmark -->
  <text x="100" y="123" text-anchor="middle"
        fill="#111"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="900"
        letter-spacing="-2">XR</text>
</svg>
